name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  submodule-pin:
    name: Submodule pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Check libsodium submodule is pinned to a tagged release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve_version.py check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run test suite with branch coverage
        run: |
          uv run --no-project --with pytest --with pytest-cov \
            pytest .github/scripts -q --cov=resolve_version --cov-branch \
            --cov-report=term-missing --cov-fail-under=100

  crypto-tests:
    name: Crypto tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: reference
            cflags: ""
          # The ESP8266 code (patch 08 products, the m15 ladder of patch 09
          # and port/x25519_m15.c, the Poly1305 and ChaCha20 paths of patches
          # 12 and 13, the SHA256 block decode of patch 14 and the SHA256
          # initial state copy of patch 16) is compiled in and exercised on
          # the host
          - name: esp8266 code paths
            cflags: "-DSODIUM_ESPHOME_TEST_ESP8266_PATHS"
          # The RP2040 arrangement: m15 ladder, reference products
          - name: narrow multiply cores
            cflags: "-DSODIUM_ESPHOME_TEST_NARROW_MUL"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Apply the patches, build and run the known-answer and differential tests
        run: tests/run_kat.sh build "${{ matrix.cflags }}"

      - name: Check the packed base point table is reproducible
        run: |
          python3 .github/scripts/gen_base_packed.py \
            libsodium/src/libsodium/crypto_core/ed25519/ref10/fe_25_5/base.h /tmp/base_packed.h
          diff -u libsodium/src/libsodium/crypto_core/ed25519/ref10/base_packed.h /tmp/base_packed.h

  # The targets are all 32-bit; an int32 overflow that a 64-bit compiler folds
  # away only shows up here. linux/386 images run natively on the amd64 runner
  crypto-tests-32bit:
    name: Crypto tests, 32-bit x86 (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: reference
            cflags: ""
          - name: esp8266 code paths
            cflags: "-DSODIUM_ESPHOME_TEST_ESP8266_PATHS"
          - name: narrow multiply cores
            cflags: "-DSODIUM_ESPHOME_TEST_NARROW_MUL"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Build and run the tests as 32-bit x86
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src \
            -e CFLAGS="${{ matrix.cflags }}" \
            alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -ec '
              apk add --no-cache build-base cmake git > /dev/null
              case "$(gcc -dumpmachine)" in
                i?86-*) echo "32-bit x86 toolchain: $(gcc -dumpmachine)" ;;
                *) echo "expected a 32-bit x86 toolchain, got $(gcc -dumpmachine)"; exit 1 ;;
              esac
              git config --global --add safe.directory "*"
              tests/run_kat.sh /tmp/build "$CFLAGS"'
