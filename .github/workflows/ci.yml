name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  submodule-pin:
    name: Submodule pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Check libsodium submodule is pinned to a tagged release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve_version.py check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run test suite with branch coverage
        run: |
          uv run --no-project --with pytest --with pytest-cov \
            pytest .github/scripts -q --cov=resolve_version --cov-branch \
            --cov-report=term-missing --cov-fail-under=100

  crypto-tests:
    name: Crypto tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: reference
            cflags: ""
          # The ESP8266 only code (patches 08 and 09, port/x25519_m15.c)
          # is compiled in and exercised on the host as well
          - name: esp8266 code paths
            cflags: "-DSODIUM_ESPHOME_TEST_ESP8266_PATHS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Apply patches
        run: |
          for f in patches/*.patch; do
            echo "Checking $f"
            git -C libsodium apply --check "../$f"
            git -C libsodium apply "../$f"
          done

      - name: Build library and tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="${{ matrix.cflags }}" .
          cmake --build build -j
          gcc -O2 -Wall -Wextra ${{ matrix.cflags }} -o build/kat tests/kat.c             -Ilibsodium/src/libsodium/include -Iport_include             build/libsodium.a

      - name: Run known-answer and differential tests
        run: ./build/kat

  # The targets are all 32-bit; an int32 overflow that a 64-bit compiler folds
  # away only shows up here. linux/386 images run natively on the amd64 runner
  crypto-tests-32bit:
    name: Crypto tests, 32-bit x86 (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: reference
            cflags: ""
          - name: esp8266 code paths
            cflags: "-DSODIUM_ESPHOME_TEST_ESP8266_PATHS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Apply patches
        run: |
          for f in patches/*.patch; do
            git -C libsodium apply "../$f"
          done

      - name: Build and run the tests as 32-bit x86
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src \
            -e CFLAGS="${{ matrix.cflags }}" alpine:3.22 sh -ec '
              apk add --no-cache build-base cmake > /dev/null
              gcc -dumpmachine
              cmake -B /tmp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="$CFLAGS" .
              cmake --build /tmp/build -j
              gcc -O2 -Wall -Wextra $CFLAGS -o /tmp/build/kat tests/kat.c \
                -Ilibsodium/src/libsodium/include -Iport_include /tmp/build/libsodium.a
              /tmp/build/kat'
